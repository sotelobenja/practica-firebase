# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_FIREBASE_A8E3E }}
          projectId: practica-firebase-a8e3e
          channelId: live
